<!-- ============================================================
     FORMULARIO CAMPAÑA — Sur Maderas x Batata
     Pegá TODO este bloque en una página de WordPress:
       · Elementor → widget "HTML"
       · o bloque "HTML personalizado" (Gutenberg)
     Publicá la página en: https://surmaderas.com.ar/Batataxsur/
     No requiere login. Lee la campaña de tu ERP y envía ahí las respuestas.
     Para otra campaña, cambiá SLUG abajo por el slug que creaste en el ERP.
     ============================================================ -->
<div id="bxs-root">
  <style>
    #bxs-root{--navy:#070614;--coral:#C8603A;font-family:'Segoe UI',system-ui,Arial,sans-serif;max-width:460px;margin:0 auto;color:#1a1a1a}
    #bxs-root *{box-sizing:border-box}
    .bxs-head{background:var(--navy);border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}
    .bxs-kicker{color:var(--coral);font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
    .bxs-sub{color:rgba(255,255,255,.55);font-size:12px;margin-top:4px}
    .bxs-card{background:#fff;border:1px solid #eee;border-radius:18px;padding:22px}
    .bxs-title{font-size:22px;font-weight:800;color:var(--navy);text-align:center;margin:0}
    .bxs-promo{color:var(--coral);font-weight:800;text-align:center;font-size:14px;margin:4px 0 0}
    .bxs-intro{color:#6b7280;font-size:14px;text-align:center;margin:10px 0 0}
    .bxs-field{margin-top:14px}
    .bxs-label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
    .bxs-input,.bxs-select,.bxs-textarea{width:100%;border:1px solid #d7d2cc;border-radius:12px;padding:12px 14px;font-size:16px;outline:none;background:#fff;font-family:inherit}
    .bxs-input:focus,.bxs-select:focus,.bxs-textarea:focus{border-color:var(--coral)}
    .bxs-stars{display:flex;gap:8px;justify-content:center}
    .bxs-star{font-size:30px;cursor:pointer;opacity:.3;background:none;border:none;padding:0}
    .bxs-star.on{opacity:1}
    .bxs-btn{width:100%;margin-top:20px;background:var(--coral);color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer}
    .bxs-btn:disabled{opacity:.5}
    .bxs-muted{color:#9ca3af;font-size:12px;text-align:center;margin-top:12px}
    .bxs-coupon{border:2px dashed var(--coral);border-radius:16px;padding:18px;text-align:center;margin:14px 0}
    .bxs-code{font-size:30px;font-weight:900;letter-spacing:2px;color:var(--coral)}
    .bxs-btn2{width:100%;margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
    .bxs-center{text-align:center}
  </style>

  <div class="bxs-head">
    <div class="bxs-kicker">Sur Maderas</div>
    <div class="bxs-sub">Mar del Plata</div>
  </div>
  <div class="bxs-card" id="bxs-card">
    <p class="bxs-center" style="color:#9ca3af">Cargando…</p>
  </div>

  <script>
  (function(){
    var API  = "https://surmaderas-api.onrender.com";
    var SLUG = "batataxsur";                 // <-- slug de la campaña creada en el ERP
    var card = document.getElementById("bxs-card");
    var camp = null, answers = {};

    function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}

    // Despierta el backend (Render free) y trae la campaña, con reintentos.
    fetch(API+"/health").catch(function(){});
    loadCampaign(6);

    function loadCampaign(tries){
      fetch(API+"/campaigns/public/"+SLUG)
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){ camp=d; renderForm(); })
        .catch(function(){
          if(tries>0){ setTimeout(function(){ loadCampaign(tries-1); }, 2500); }
          else { card.innerHTML='<p class="bxs-center" style="color:#9ca3af">La promo no está disponible en este momento. Probá de nuevo en un minuto.</p>'; }
        });
    }

    function renderForm(){
      var qs = (camp.questions||[]).map(function(q){
        var field;
        if(q.type==="textarea") field='<textarea class="bxs-textarea" rows="3" data-q="'+esc(q.id)+'"></textarea>';
        else if(q.type==="select"){ field='<select class="bxs-select" data-q="'+esc(q.id)+'"><option value="">Elegí…</option>'+(q.options||[]).map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select>'; }
        else if(q.type==="rating"){ field='<div class="bxs-stars" data-rating="'+esc(q.id)+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" class="bxs-star" data-n="'+n+'">★</button>';}).join("")+'</div>'; }
        else field='<input class="bxs-input" data-q="'+esc(q.id)+'">';
        return '<div class="bxs-field"><label class="bxs-label">'+esc(q.label)+(q.required?" *":"")+'</label>'+field+'</div>';
      }).join("");

      card.innerHTML =
        '<h1 class="bxs-title">'+esc(camp.name)+'</h1>'+
        (camp.discount_pct>0?'<p class="bxs-promo">'+esc(camp.discount_pct)+'% OFF'+(camp.scope_text?' · '+esc(camp.scope_text):'')+'</p>':'')+
        (camp.intro_text?'<p class="bxs-intro">'+esc(camp.intro_text)+'</p>':'')+
        '<div class="bxs-field"><label class="bxs-label">Nombre *</label><input class="bxs-input" id="bxs-name" autocomplete="name"></div>'+
        '<div class="bxs-field"><label class="bxs-label">Teléfono / WhatsApp *</label><input class="bxs-input" id="bxs-phone" type="tel" inputmode="tel" placeholder="Ej: 223 15 1234567"></div>'+
        '<div class="bxs-field"><label class="bxs-label">Email (opcional)</label><input class="bxs-input" id="bxs-email" type="email" inputmode="email"></div>'+
        qs+
        '<button class="bxs-btn" id="bxs-submit">Obtener mi cupón</button>'+
        '<p class="bxs-muted">Completá para recibir tu descuento en Sur Maderas.</p>';

      // ratings
      Array.prototype.forEach.call(card.querySelectorAll(".bxs-stars"), function(box){
        var qid = box.getAttribute("data-rating");
        box.addEventListener("click", function(e){
          var b=e.target.closest(".bxs-star"); if(!b) return;
          var n=parseInt(b.getAttribute("data-n")); answers[qid]=n;
          Array.prototype.forEach.call(box.querySelectorAll(".bxs-star"), function(s,i){ s.classList.toggle("on", i<n); });
        });
      });

      document.getElementById("bxs-submit").addEventListener("click", submit);
    }

    function submit(){
      var name=(document.getElementById("bxs-name").value||"").trim();
      var phone=(document.getElementById("bxs-phone").value||"").trim();
      var email=(document.getElementById("bxs-email").value||"").trim();
      if(!name){ alert("Ingresá tu nombre."); return; }
      if(!phone){ alert("Ingresá tu teléfono."); return; }
      Array.prototype.forEach.call(card.querySelectorAll("[data-q]"), function(el){ answers[el.getAttribute("data-q")]=el.value; });
      for(var i=0;i<(camp.questions||[]).length;i++){ var q=camp.questions[i]; if(q.required && !answers[q.id]){ alert("Completá: "+q.label); return; } }

      var btn=document.getElementById("bxs-submit"); btn.disabled=true; btn.textContent="Enviando…";
      postWithRetry(4, {customer_name:name, phone:phone, email:email, answers:answers});
    }

    function postWithRetry(tries, body){
      fetch(API+"/campaigns/public/"+SLUG+"/submit", {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
      }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
        .then(function(res){
          if(!res.ok) throw new Error(res.d && res.d.detail || "error");
          showCoupon(res.d);
        })
        .catch(function(err){
          if(tries>0){ setTimeout(function(){ postWithRetry(tries-1, body); }, 2500); }
          else { alert("No se pudo enviar. Reintentá en un momento."); var b=document.getElementById("bxs-submit"); if(b){b.disabled=false;b.textContent="Obtener mi cupón";} }
        });
    }

    function showCoupon(d){
      card.innerHTML =
        '<div class="bxs-center" style="font-size:44px">🎉</div>'+
        '<h1 class="bxs-title">¡Listo! Tu cupón</h1>'+
        '<p class="bxs-promo">'+esc(d.discount_pct)+'% OFF'+(d.scope_text?' · '+esc(d.scope_text):'')+'</p>'+
        '<div class="bxs-coupon"><div class="bxs-code">'+esc(d.coupon_code)+'</div></div>'+
        '<button class="bxs-btn2" id="bxs-copy">Copiar código</button>'+
        '<p class="bxs-muted">Mostrá este código en la caja de Sur Maderas para usar tu descuento.</p>';
      document.getElementById("bxs-copy").addEventListener("click", function(){
        navigator.clipboard && navigator.clipboard.writeText(d.coupon_code).then(function(){ alert("Código copiado"); });
      });
    }
  })();
  </script>
</div>
