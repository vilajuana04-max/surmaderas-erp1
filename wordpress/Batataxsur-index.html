<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur Maderas × Batata · 15% OFF</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff6900;--yellow:#ffd301;--pink:#ffe3ef;--green:#54fe9d;--dark:#3a3942;
    --navy:#3a3942;--coral:#ff6900;--cream:#ffffff;
    --line:#f3d7e1;--muted:#9a8f95;--head:'Fredoka','Poppins',sans-serif;--body:'Poppins',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--pink);font-family:var(--body);color:var(--dark);line-height:1.45;
    padding:24px max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:520px;margin:0 auto;background:var(--cream);border-radius:28px;overflow:hidden;
    box-shadow:0 20px 60px rgba(62,56,66,.16);border:1px solid #f0e6ea}
  .hero{position:relative;padding:26px 22px 30px;text-align:center;color:#fff;
    background:var(--dark)}
  .hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:var(--cream);border-radius:22px 22px 0 0}
  .lockup{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .lbatata{height:30px;width:auto;display:block}
  .x{font-family:var(--head);font-weight:600;font-size:24px;color:var(--yellow)}
  .surchip{background:#fff;border-radius:12px;padding:6px 10px;display:flex;align-items:center}
  .surchip img{height:36px;width:auto;display:block}
  .badge{display:inline-block;background:var(--green);color:var(--dark);font-family:var(--head);font-weight:700;font-size:22px;padding:7px 18px;border-radius:999px;margin:6px 0 8px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
  .herosub{font-size:13.5px;opacity:.96;max-width:420px;margin:0 auto}
  .body{padding:6px 20px 24px}
  .q{margin-top:20px}
  .qlabel{font-family:var(--head);font-weight:600;font-size:16.5px;color:var(--navy);margin:0 0 3px}
  .qhint{font-size:12px;color:var(--muted);margin:0 0 10px}
  .inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;font-family:var(--body);outline:none;background:#fff;color:var(--dark)}
  .inp:focus{border-color:var(--orange)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border:2px solid var(--line);background:#fff;color:var(--dark);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500;cursor:pointer;transition:.12s;font-family:var(--body)}
  .pill:hover{border-color:var(--orange)}
  .pill.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .pill.on.multi{background:var(--navy);border-color:var(--navy)}
  .cta{width:100%;margin-top:26px;background:var(--orange);color:#fff;border:none;border-radius:18px;padding:18px;font-family:var(--head);font-weight:700;font-size:20px;cursor:pointer;box-shadow:0 8px 0 var(--dark)}
  .cta:active{transform:translateY(3px);box-shadow:0 5px 0 var(--dark)}
  .cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 var(--dark)}
  .follow{background:var(--pink);border-radius:18px;padding:16px}
  .fitem{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--pink);border-radius:14px;padding:13px 14px;margin-top:10px;text-decoration:none;color:var(--dark);transition:border-color .15s,background .15s}
  .fitem .ig{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--dark)}
  .fitem .ig.light{background:#fff;border:1px solid var(--pink)}
  .fitem .ig img{width:100%;height:100%;object-fit:contain;padding:4px}
  .fitem .fname{flex:1;font-weight:700;font-size:15px}
  .fitem .fstate{font-family:var(--head);font-weight:700;font-size:13px;color:var(--dark);background:var(--yellow);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .fitem.done{border-color:var(--green);background:#f4fff9}
  .fitem.done .fstate{color:var(--dark);background:var(--green)}
  .foot{text-align:center;font-size:11.5px;color:#a79ba1;margin-top:12px}
  .brandfoot{text-align:center;padding:16px;background:var(--navy);color:#fff}
  .brandfoot b{font-family:var(--head);font-weight:600}
  .brandfoot span{display:block;font-size:11px;opacity:.5;margin-top:2px}
  .done{padding:34px 24px;text-align:center}
  .emoji{font-size:54px}
  .donetitle{font-family:var(--head);font-weight:700;font-size:26px;color:var(--navy);margin:6px 0 2px}
  .donesub{color:var(--coral);font-weight:700;font-size:15px;margin-bottom:16px}
  .couponbox{border:3px dashed var(--orange);border-radius:20px;padding:20px;background:#fff;margin-bottom:14px}
  .code{font-family:var(--head);font-weight:700;font-size:34px;letter-spacing:2px;color:var(--orange)}
  .copy{width:100%;background:var(--navy);color:#fff;border:none;border-radius:16px;padding:15px;font-family:var(--head);font-weight:600;font-size:16px;cursor:pointer}
  @media(max-width:480px){.batata{font-size:26px}.badge{font-size:19px}}
</style>
</head>

  html+='<button class="cta" id="cta" disabled>SEGUÍ A LOS DOS PARA CONTINUAR</button><p class="foot">Al enviar, recibirás tu beneficio por email.</p>';
  form.innerHTML=html;
  form.querySelectorAll(".opts").forEach(function(g){
    var id=g.getAttribute("data-group"),type=g.getAttribute("data-type"),max=parseInt(g.getAttribute("data-max")||"0");
    g.addEventListener("click",function(e){ var b=e.target.closest(".pill"); if(!b)return; var val=b.getAttribute("data-val");
      if(type==="single"){ g.querySelectorAll(".pill").forEach(function(p){p.classList.remove("on");}); b.classList.add("on"); state[id]=val; }
      else{ var arr=state[id]||[];
        if(b.classList.contains("on")){ b.classList.remove("on"); arr=arr.filter(function(x){return x!==val;}); }
        else{ if(max&&arr.length>=max){ alert("Podés elegir hasta "+max+" opciones."); return; } b.classList.add("on"); b.classList.add("multi"); arr=arr.concat([val]); }
        state[id]=arr; } });
  });
  var followed={sur:false,batata:false};
  function syncCta(){ var b=document.getElementById("cta"); var ok=followed.sur&&followed.batata; b.disabled=!ok; b.textContent=ok?"QUIERO MI 15% OFF":"SEGUÍ A LOS DOS PARA CONTINUAR"; }
  function markFollow(key,id){ var el=document.getElementById(id); if(!el)return; el.addEventListener("click",function(){ followed[key]=true; el.classList.add("done"); var s=el.querySelector(".fstate"); if(s)s.textContent="Siguiendo ✓"; syncCta(); }); }
  markFollow("sur","ig-sur"); markFollow("batata","ig-batata");
  document.getElementById("cta").addEventListener("click",function(){
    if(!(followed.sur&&followed.batata)){ alert("Seguí a los dos Instagram (Sur Maderas y Batata) para activar tu cupón."); return; }
    form.querySelectorAll("input[data-id]").forEach(function(el){ state[el.getAttribute("data-id")]=el.value.trim(); });
    if(!state.nombre){ alert("Ingresá tu nombre y apellido."); return; }
    if(!state.telefono){ alert("Ingresá tu teléfono."); return; }
    if(!state.email){ alert("Ingresá tu email."); return; }
    var answers={"¿Ya conocía Sur Maderas?":state.conocia||"","Intereses":(state.intereses||[]).join(", "),"Productos infantiles":(state.infantil||[]).join(", "),"Espacio":state.espacio||"","Qué valora":(state.valora||[]).join(", "),"Proyecto próximo":state.proyecto||"","Vive en Mar del Plata":state.mdp||"","Quiere novedades":state.novedades||"","Sigue Instagram":"Sí (@"+IG_SUR_USER+" + @"+IG_BATATA_USER+")"};
    var btn=this; btn.disabled=true; btn.textContent="Enviando…";
    post(4,{customer_name:state.nombre,phone:state.telefono,email:state.email,answers:answers});
  });
  function post(tries,body){
    var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort();},15000);
    fetch(API+"/campaigns/public/"+SLUG+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal})
      .then(function(r){clearTimeout(to);return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(res){ if(!res.ok) throw new Error((res.d&&res.d.detail)||"error"); done(res.d); })
      .catch(function(){ clearTimeout(to); if(tries>0){ setTimeout(function(){post(tries-1,body);},2000); }
        else{ alert("No se pudo generar el cupón. El sistema no está disponible en este momento, probá en unos minutos."); var b=document.getElementById("cta"); if(b){b.disabled=false;b.textContent="QUIERO MI 15% OFF";} } });
  }
  function done(d){
    card.innerHTML='<div class="hero"><div class="lockup"><img class="lbatata" src="'+LB+'" alt="Batata"><span class="x">×</span><span class="surchip"><img src="'+LS+'" alt="Sur Maderas"></span></div></div>'+
      '<div class="done"><div class="emoji">🎉</div><p class="donetitle">¡Listo! Tu cupón</p>'+
      '<p class="donesub">'+esc(d.discount_pct)+'% OFF'+(d.scope_text?' · '+esc(d.scope_text):'')+'</p>'+
      '<div class="couponbox"><div class="code">'+esc(d.coupon_code)+'</div></div>'+
      '<button class="copy" id="copy">Copiar código</button>'+
      '<p class="foot" style="margin-top:14px">Mostralo en la caja de Sur Maderas para usar tu 15% OFF.</p></div>'+
      '<div class="brandfoot"><b>Sur Maderas</b><span>Mar del Plata · Hacemos realidad tus ideas</span></div>';
    document.getElementById("copy").addEventListener("click",function(){ try{navigator.clipboard.writeText(d.coupon_code);}catch(e){} });
    window.scrollTo({top:0,behavior:"smooth"});
  }
})();
