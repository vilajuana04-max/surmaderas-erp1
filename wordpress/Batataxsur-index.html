<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur Maderas × Batata · 15% OFF</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff6900;--yellow:#ffd301;--pink:#ffe3ef;--green:#54fe9d;--dark:#3a3942;
    --navy:#3a3942;--coral:#ff6900;--cream:#ffffff;
    --line:#f3d7e1;--muted:#9a8f95;--head:'Fredoka','Poppins',sans-serif;--body:'Poppins',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--pink);font-family:var(--body);color:var(--dark);line-height:1.45;
    padding:24px max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:520px;margin:0 auto;background:var(--cream);border-radius:28px;overflow:hidden;
    box-shadow:0 20px 60px rgba(62,56,66,.16);border:1px solid #f0e6ea}
  .hero{position:relative;padding:26px 22px 30px;text-align:center;color:#fff;
    background:var(--orange)}
  .hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:var(--cream);border-radius:22px 22px 0 0}
  .lockup{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .lbatata{height:30px;width:auto;display:block}
  .x{font-family:var(--head);font-weight:600;font-size:24px;color:#fff}
  .lsur{height:48px;width:auto;display:block}
  .badge{display:inline-block;background:var(--green);color:var(--dark);font-family:var(--head);font-weight:700;font-size:22px;padding:7px 18px;border-radius:999px;margin:6px 0 8px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
  .herosub{font-size:13.5px;opacity:.96;max-width:420px;margin:0 auto}
  .body{padding:6px 20px 24px}
  .q{margin-top:20px}
  .qlabel{font-family:var(--head);font-weight:600;font-size:16.5px;color:var(--navy);margin:0 0 3px}
  .qhint{font-size:12px;color:var(--muted);margin:0 0 10px}
  .inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;font-family:var(--body);outline:none;background:#fff;color:var(--dark)}
  .inp:focus{border-color:var(--orange)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border:2px solid var(--line);background:#fff;color:var(--dark);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500;cursor:pointer;transition:.12s;font-family:var(--body)}
  .pill:hover{border-color:var(--orange)}
  .pill.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .pill.on.multi{background:var(--navy);border-color:var(--navy)}
  .cta{width:100%;margin-top:26px;background:var(--orange);color:#fff;border:none;border-radius:18px;padding:18px;font-family:var(--head);font-weight:700;font-size:20px;cursor:pointer;box-shadow:0 8px 0 var(--dark)}
  .cta:active{transform:translateY(3px);box-shadow:0 5px 0 var(--dark)}
  .cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 var(--dark)}
  .follow{background:var(--pink);border-radius:18px;padding:16px}
  .fitem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--pink);border-radius:14px;padding:12px;margin-top:10px;text-decoration:none;color:var(--dark);transition:border-color .15s,background .15s}
  .fitem .ig{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--dark)}
  .fitem .ig.sur{background:var(--orange)}
  .fitem .ig img{width:100%;height:100%;object-fit:contain;padding:4px}
  .fitem .fname{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.2;word-break:break-word}
  .fitem .ig{flex:0 0 38px;width:38px;height:38px}
  .fitem .fstate{flex:0 0 auto}
  .fitem .fstate{font-family:var(--head);font-weight:700;font-size:13px;color:var(--dark);background:var(--yellow);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .fitem.done{border-color:var(--green);background:#f4fff9}
  .fitem.done .fstate{color:var(--dark);background:var(--green)}
  .foot{text-align:center;font-size:11.5px;color:#a79ba1;margin-top:12px}
  .brandfoot{text-align:center;padding:16px;background:var(--navy);color:#fff}
  .brandfoot b{font-family:var(--head);font-weight:600}
  .brandfoot span{display:block;font-size:11px;opacity:.5;margin-top:2px}
  .done{padding:34px 24px;text-align:center}
  .emoji{font-size:54px}
  .donetitle{font-family:var(--head);font-weight:700;font-size:26px;color:var(--navy);margin:6px 0 2px}
  .donesub{color:var(--coral);font-weight:700;font-size:15px;margin-bottom:16px}
  .couponbox{border:3px dashed var(--orange);border-radius:20px;padding:20px;background:#fff;margin-bottom:14px}
  .code{font-family:var(--head);font-weight:700;font-size:34px;letter-spacing:2px;color:var(--orange)}
  .copy{width:100%;background:var(--navy);color:#fff;border:none;border-radius:16px;padding:15px;font-family:var(--head);font-weight:600;font-size:16px;cursor:pointer}
  @media(max-width:480px){.batata{font-size:26px}.badge{font-size:19px}}

  /* ── Wizard ── */
  .steps{display:flex;align-items:flex-start;gap:8px;margin:14px 2px 22px}
  .st{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto}
  .stn{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:13px;background:var(--pink);color:var(--muted)}
  .st.on .stn{background:var(--orange);color:#fff}
  .st.done .stn{background:var(--green);color:var(--dark)}
  .stl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .st.on .stl{color:var(--orange)} .st.done .stl{color:var(--dark)}
  .stline{flex:1;height:4px;border-radius:999px;background:var(--pink);margin-top:11px}
  .stline.done{background:var(--green)}
  .stephd{margin-bottom:8px}
  .qtitle{font-family:var(--head);font-weight:700;font-size:24px;color:var(--dark);margin:0 0 4px;line-height:1.12}
  .icards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
  .icard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:2px solid var(--pink);border-radius:16px;padding:15px 8px;cursor:pointer;color:var(--dark);font-family:var(--body);transition:border-color .15s,background .15s,transform .08s}
  .icard:active{transform:scale(.97)}
  .icard .ic{font-size:26px;line-height:1}
  .icard .il{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
  .icard.on{border-color:var(--orange);background:rgba(255,105,0,.09)}
  .spaces{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .sbtn{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--pink);border-radius:14px;padding:14px;cursor:pointer;color:var(--dark);font-family:var(--body);font-weight:600;font-size:15px;text-align:left;transition:border-color .15s,background .15s}
  .sbtn .se{font-size:22px;line-height:1}
  .sbtn.on{border-color:var(--orange);background:rgba(255,105,0,.09)}
  .smsg{margin:11px 2px 0;font-family:var(--head);font-weight:600;color:var(--orange);font-size:14.5px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s}
  .smsg.show{opacity:1;transform:none}
  .stepnav{display:flex;align-items:center;gap:10px;margin-top:26px}
  .back{background:#fff;border:2px solid var(--pink);color:var(--dark);border-radius:16px;padding:16px;font-family:var(--head);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
  .cta.grow{flex:1;margin-top:0}
  .clabel{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .wbtn,.igbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border-radius:16px;padding:15px;font-family:var(--head);font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:none}
  .wbtn{background:var(--green);color:var(--dark)}
  .igbtn{background:var(--orange);color:#fff}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
  .confetti i{position:absolute;top:-14px;width:9px;height:6px;border-radius:2px;animation:cfall linear forwards}
  @keyframes cfall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(104vh) rotate(680deg)}}

  .wbtn{flex-direction:column;gap:2px;line-height:1.15;text-align:center}
  .wbtn .wl{font-size:15px}
  .wbtn .waddr{font-size:12.5px;font-weight:600;opacity:.85}
  .wbtn.main{background:var(--green);color:var(--dark);padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.10)}
  .wbtn.main .wl{font-size:16px}
  .wbtn.alt{background:#fff;border:2px solid var(--green);color:var(--dark)}
  .favor{margin-top:20px;background:var(--pink);border-radius:18px;padding:16px}
  .favortxt{font-family:var(--head);font-weight:600;color:var(--dark);font-size:15px;margin:0 0 2px;text-align:center}
</style>
</head>

  function bar(active){
    var L=["Contanos","Tu 15%"],h='<div class="steps">';
    for(var i=0;i<L.length;i++){ var n=i+1,cls=n<active?"st done":(n===active?"st on":"st");
      h+='<div class="'+cls+'"><span class="stn">'+(n<active?"✓":n)+'</span><span class="stl">'+L[i]+'</span></div>';
      if(i<L.length-1) h+='<div class="stline'+(n<active?" done":"")+'"></div>';
    }
    return h+'</div>';
  }
  function render(){ renderQuestions(); }


  function readFields(){
    var n=document.getElementById("f-nombre"),t=document.getElementById("f-telefono"),e=document.getElementById("f-email");

    if(!state.email){alert("Ingresá tu email.");return;}
    var answers={"Intereses":state.intereses.join(", "),"Espacio a transformar":state.espacio||"","Qué valora":state.valora.join(", "),"Sigue Instagram":"Sí (@"+IG_SUR_USER+" + @"+IG_BATATA_USER+")"};
    var btn=document.getElementById("send"); btn.disabled=true; btn.textContent="Enviando…";
    post(4,{customer_name:state.nombre,phone:state.telefono,email:state.email,answers:answers});
  }

  function post(tries,body){
    var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort();},15000);
    fetch(API+"/campaigns/public/"+SLUG+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal})
      .then(function(r){clearTimeout(to);return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(res){ if(!res.ok) throw new Error((res.d&&res.d.detail)||"error"); done(res.d); })
      .catch(function(){ clearTimeout(to); if(tries>0){ setTimeout(function(){post(tries-1,body);},2000); } else { alert("No se pudo generar el cupón. Probá de nuevo en unos minutos."); var b=document.getElementById("send"); if(b){b.disabled=false;b.textContent="QUIERO MI 15% OFF";} } });
  }

  function confetti(){
    var c=document.createElement("div"); c.className="confetti";
    var cols=["#ff6900","#ffd301","#54fe9d","#ffe3ef","#ffffff"];
    for(var i=0;i<60;i++){ var p=document.createElement("i"); p.style.left=(Math.random()*100)+"%"; p.style.background=cols[i%cols.length]; p.style.animationDelay=(Math.random()*0.6)+"s"; p.style.animationDuration=(2.4+Math.random()*1.6)+"s"; var sz=6+Math.random()*7; p.style.width=sz+"px"; p.style.height=(sz*0.6)+"px"; c.appendChild(p); }
    card.appendChild(c); setTimeout(function(){ if(c.parentNode)c.parentNode.removeChild(c); },5200);
  }

  function done(d){
    function waBtn(num,addr,cls){ if(!/^\d{8,15}$/.test(num)) return ""; var wa="https://wa.me/"+num+"?text="+encodeURIComponent("¡Hola! Tengo mi cupón "+d.coupon_code+" del 15% OFF de la colaboración Batata × Sur Maderas 🎉"); return '<a class="wbtn '+cls+'" href="'+wa+'" target="_blank" rel="noopener"><span class="wl">💬 WhatsApp</span><span class="waddr">'+addr+'</span></a>'; }
    var waHtml=waBtn(WA_INDE,"Av. Independencia y Av. Juan B. Justo","main")+waBtn(WA_LURO,"Av. Luro y Av. Jara","alt");
    card.innerHTML='<div class="hero"><div class="lockup"><img class="lbatata" src="'+LB+'" alt="Batata"><span class="x">×</span><img class="lsur" src="'+LS+'" alt="Sur Maderas"></div></div>'+
      '<div class="body">'+bar(3)+
      '<div class="done"><div class="emoji">🎉</div><p class="donetitle">¡Listo! Tu beneficio está en camino</p>'+
      '<p class="donesub">'+esc(d.discount_pct)+'% OFF'+(d.scope_text?' · '+esc(d.scope_text):'')+'</p>'+
      '<div class="couponbox"><span class="clabel">Tu cupón</span><div class="code">'+esc(d.coupon_code)+'</div></div>'+
      '<button class="copy" id="copy">Copiar código</button>'+
      waHtml+
      '<div class="favor"><p class="favortxt">¿Nos hacés un último favor? Seguinos en Instagram 💛</p>'+
      '<a class="fitem" href="'+IG_SUR+'" target="_blank" rel="noopener"><span class="ig sur"><img src="'+LS+'" alt=""></span><span class="fname">@'+esc(IG_SUR_USER)+'</span><span class="fstate">Seguir</span></a>'+
      '<a class="fitem" href="'+IG_BATATA+'" target="_blank" rel="noopener"><span class="ig"><img src="'+BATATA_SQ+'" alt=""></span><span class="fname">@'+esc(IG_BATATA_USER)+'</span><span class="fstate">Seguir</span></a>'+
      '</div>'+
      '<p class="foot" style="margin-top:14px">Mostrá el código en la caja de Sur Maderas para usar tu 15% OFF.</p></div>'+
      '</div>'+
      '<div class="brandfoot"><b>Sur Maderas</b><span>Mar del Plata · Hacemos realidad tus ideas</span></div>';
    var cp=document.getElementById("copy"); if(cp) cp.addEventListener("click",function(){ try{navigator.clipboard.writeText(d.coupon_code); cp.textContent="¡Copiado! ✓";}catch(e){} });
    card.querySelectorAll(".favor .fitem").forEach(function(el){ el.addEventListener("click",function(){ el.classList.add("done"); var st=el.querySelector(".fstate"); if(st)st.textContent="Siguiendo ✓"; }); });
    try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){}
    confetti();
  }

  render();
})();
</script>
</body>
</html>
